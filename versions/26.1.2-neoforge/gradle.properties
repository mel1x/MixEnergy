# Minecraft 26.1.2 on NeoForge, built with ModDevGradle.
# NeoForge moved the block-break event in this patch, making it incompatible with
# a jar compiled for Minecraft 26.1 - 26.1.1.
loader=neoforge
java_version=25

minecraft_version=26.1.2
minecraft_version_range=[26.1.2,26.2)
neoforge_version=26.1.2.85
# javafml language provider version (FancyModLoader), not the NeoForge version.
loader_version_range=[11,)
neoforge_version_range=[26.1.2,)

pack_format=84

deps_combatroll=maven.modrinth:combat-roll:3.0.1+26.1.2-neoforge
deps_bettercombat=maven.modrinth:better-combat:3.2.2+26.1.2-neoforge
combatroll_range=[1.0.0,)
bettercombat_range=[2.0.0,)
