# Minecraft 1.20.3 - 1.20.4 on MinecraftForge, built with ForgeGradle.
#
# Forge 49 is its own major because Minecraft 1.20.3 broke mod compatibility with 1.20.2;
# see versions/1.20.2-forge for the full 48/49/50 split. Both 1.20.3 and 1.20.4 run on
# Forge 49, so one jar covers them.
#
# Combat Roll and Better Combat have no release for this line, so their integrations are
# compiled out of this target.
loader=forge
java_version=17

minecraft_version=1.20.4
# Forge never shipped a build for 1.20.5, so nothing needs to cover that gap.
minecraft_version_range=[1.20.3,1.20.5)
forge_version=49.2.8
forge_version_range=[49,50)
# javafml language provider version, which Forge keeps equal to its own major version.
loader_version_range=[49,)

mapping_channel=parchment
mapping_version=2024.04.14-1.20.4

pack_format=22
