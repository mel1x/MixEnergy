# Minecraft 1.20.1 on MinecraftForge, built with ForgeGradle.
# 1.20.2-1.20.6 is its own node (see versions/1.20.6-forge) because Forge rewrote its
# networking for 1.20.2, removing the SimpleChannel/NetworkRegistry API used here.
loader=forge
java_version=17

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
forge_version=47.3.0
forge_version_range=[47,)
loader_version_range=[47,)

mapping_channel=parchment
mapping_version=2023.09.03-1.20.1

pack_format=15

# Optional integrations. Remove a line to drop the integration from this target.
deps_combatroll=maven.modrinth:combat-roll:1.3.3+1.20.1-forge
deps_bettercombat=maven.modrinth:better-combat:1.9.0+1.20.1-forge
combatroll_range=[1.0.0,)
bettercombat_range=[1.8.0,2.0.0)

# Development-only runtime dependencies of the integrations above.
deps_runtime_only=dev.kosmx.player-anim:player-animation-lib-forge:1.0.2-rc1+1.20;me.shedaniel.cloth:cloth-config-forge:11.1.136
