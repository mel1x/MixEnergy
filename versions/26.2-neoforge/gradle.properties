# Minecraft 26.2 on NeoForge, built with ModDevGradle.
# NeoForge for this line is still in beta and Parchment has no mappings yet,
# so this target uses official Mojang names only.
loader=neoforge
# Minecraft 26.2 and its NeoForge loader are built for Java 25.
java_version=25

minecraft_version=26.2
minecraft_version_range=[26.2,26.3)
neoforge_version=26.2.0.32-beta
# javafml language provider version (FancyModLoader), not the NeoForge version.
loader_version_range=[11,)
neoforge_version_range=[26.2,)

pack_format=88

deps_combatroll=maven.modrinth:combat-roll:3.0.1+26.2-neoforge
deps_bettercombat=maven.modrinth:better-combat:3.2.2+26.2-neoforge
combatroll_range=[1.0.0,)
bettercombat_range=[2.0.0,)
