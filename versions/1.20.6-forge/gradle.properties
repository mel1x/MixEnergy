# Minecraft 1.20.6 on MinecraftForge, built with ForgeGradle.
#
# Forge 50 is its own major because Minecraft 1.20.5 broke mod compatibility with 1.20.4;
# see versions/1.20.2-forge for the full 48/49/50 split. 1.20.5 is where a batch of vanilla
# APIs this project tracks moved (Holder-based effects and attributes, the entity data
# builder, the LayeredDraw HUD hook), so the predicates in src/ key off 1.20.5 - but Forge
# never shipped a build for 1.20.5 itself, so the declared range starts at 1.20.6.
#
# Combat Roll and Better Combat have no release for this line, so their integrations are
# compiled out of this target.
#
# Minecraft 1.20.5+ ships Java 21 to end users.
loader=forge
java_version=21

minecraft_version=1.20.6
minecraft_version_range=[1.20.6,1.21)
forge_version=50.2.10
forge_version_range=[50,)
# javafml language provider version, which Forge keeps equal to its own major version.
loader_version_range=[50,)

mapping_channel=parchment
mapping_version=2024.06.16-1.20.6

pack_format=32
