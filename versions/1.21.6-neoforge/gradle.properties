# Minecraft 1.21.6 on NeoForge, built with ModDevGradle.
#
# This is its own node, split out of the 1.21.6-1.21.8 range, because NeoForge's own
# payload-handler split (PayloadRegistrar.playBidirectional taking two handlers, and
# ClientNetworkRegistry validating that every clientbound payload has one) landed in the
# 21.7.x line. NeoForge 21.6.20-beta - the only release for this Minecraft version - still
# uses the older single-handler registration, so a jar compiled against 21.7+ throws
# NoSuchMethodError on this exact release. Everything else about 1.21.6 (the GUI rendering
# overhaul, ValueInput/ValueOutput, blit taking a render pipeline) matches 1.21.7-1.21.8.
loader=neoforge
java_version=21

minecraft_version=1.21.6
minecraft_version_range=[1.21.6,1.21.7)
neoforge_version=21.6.20-beta
# javafml language provider version (FancyModLoader), not the NeoForge version.
loader_version_range=[9,)
neoforge_version_range=[21.6,)

parchment_minecraft=1.21.6
parchment_version=2025.06.29

pack_format=63

deps_combatroll=maven.modrinth:combat-roll:3.0.0+1.21.8-neoforge
deps_bettercombat=maven.modrinth:better-combat:3.0.1+1.21.8-neoforge
combatroll_range=[1.0.0,)
bettercombat_range=[2.0.0,)
