# Minecraft 1.21.7 - 1.21.8 on NeoForge, built with ModDevGradle.
# 1.21.6 is its own node (see versions/1.21.6-neoforge) because NeoForge's
# payload-handler split landed one patch later, in the 21.7.x line.
loader=neoforge
java_version=21

minecraft_version=1.21.8
minecraft_version_range=[1.21.7,1.21.9)
neoforge_version=21.8.54
# javafml language provider version (FancyModLoader), not the NeoForge version.
loader_version_range=[9,)
neoforge_version_range=[21.7,)

parchment_minecraft=1.21.8
parchment_version=2025.09.14

pack_format=64

deps_combatroll=maven.modrinth:combat-roll:3.0.0+1.21.8-neoforge
deps_bettercombat=maven.modrinth:better-combat:3.0.1+1.21.8-neoforge
combatroll_range=[1.0.0,)
bettercombat_range=[2.0.0,)
