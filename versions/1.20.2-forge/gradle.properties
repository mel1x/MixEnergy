# Minecraft 1.20.2 on MinecraftForge, built with ForgeGradle.
#
# Forge bumps its major version whenever Minecraft breaks mod compatibility, so each Forge
# major in the 1.20.2-1.20.6 span is its own target here: 48 = 1.20.2, 49 = 1.20.3-1.20.4,
# 50 = 1.20.5-1.20.6. This one exists because Forge rewrote its networking for 1.20.2 -
# SimpleChannel/NetworkRegistry.newSimpleChannel gave way to a ChannelBuilder, and
# NetworkEvent/DistExecutor to CustomPayloadEvent - so a 1.20.1 jar cannot load here.
#
# Combat Roll and Better Combat have a 1.20.2 Forge release, unlike the later 1.20.x lines.
loader=forge
java_version=17

minecraft_version=1.20.2
minecraft_version_range=[1.20.2,1.20.3)
forge_version=48.1.0
forge_version_range=[48,49)
# javafml language provider version, which Forge keeps equal to its own major version.
loader_version_range=[48,)

mapping_channel=parchment
mapping_version=2023.12.10-1.20.2

pack_format=18

deps_combatroll=maven.modrinth:combat-roll:1.3.0+1.20.2-forge
deps_bettercombat=maven.modrinth:better-combat:1.8.5+1.20.2-forge
combatroll_range=[1.0.0,)
bettercombat_range=[1.8.0,2.0.0)
