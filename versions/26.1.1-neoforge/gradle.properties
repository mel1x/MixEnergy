# Minecraft 26.1 - 26.1.1 on NeoForge, built against the latest compatible patch.
# NeoForge 26.1.2 moved the block-break event to a new class, so it needs a separate jar.
loader=neoforge
java_version=25

minecraft_version=26.1.1
minecraft_version_range=[26.1,26.1.2)
neoforge_version=26.1.1.15-beta
# javafml language provider version (FancyModLoader), not the NeoForge version.
loader_version_range=[11,)
neoforge_version_range=[26.1,26.1.2)

pack_format=84

deps_combatroll=maven.modrinth:combat-roll:3.0.1+26.1.2-neoforge
deps_bettercombat=maven.modrinth:better-combat:3.2.2+26.1.2-neoforge
combatroll_range=[1.0.0,)
bettercombat_range=[2.0.0,)
