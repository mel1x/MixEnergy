// Shared build script. Stonecutter runs it once per entry registered in settings.gradle,
// with versions/<target>/gradle.properties layered on top of the root gradle.properties.
plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)' apply false
    id 'org.parchmentmc.librarian.forgegradle' version '1.+' apply false
    id 'net.neoforged.moddev' version '2.0.142' apply false
}

def target = stonecutter.current
def mcVersion = target.version
def loader = property('loader').toString()
def isForge = loader == 'forge'
def javaVersion = Integer.parseInt(property('java_version').toString())

def combatRollDep = findProperty('deps_combatroll')
def betterCombatDep = findProperty('deps_bettercombat')

// Values available to "//? if <constant>" comments in ./src.
// Version predicates such as "//? if >=1.21" work without being declared here.
stonecutter.constants.match(loader, 'forge', 'neoforge')
stonecutter.constants.put('combatroll', combatRollDep != null)
stonecutter.constants.put('bettercombat', betterCombatDep != null)

version = "${mod_version}+${mcVersion}-${loader}"
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.20.x ships Java 17 to end users, 1.20.5 and newer ship Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)

println "MixEnergy ${mcVersion}-${loader} | Java ${javaVersion} | Gradle JVM ${System.getProperty 'java.version'}"

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'KosmX'
        url = 'https://maven.kosmx.dev/'
        content {
            includeGroup 'dev.kosmx.player-anim'
        }
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
        content {
            includeGroup 'me.shedaniel.cloth'
        }
    }
}

if (isForge) {
    apply plugin: 'net.minecraftforge.gradle'
    apply plugin: 'org.parchmentmc.librarian.forgegradle'

    minecraft {
        // Parchment layers community parameter names and javadocs over the official
        // Mojang names. See https://parchmentmc.org/docs/getting-started
        mappings channel: mapping_channel, version: mapping_version

        // Required so that processResources runs against the IDE output before launching.
        copyIdeResources = true

        runs {
            configureEach {
                workingDirectory project.file('run')

                property 'forge.logging.markers', 'REGISTRIES'
                property 'forge.logging.console.level', 'debug'
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile',
                        "${project.layout.buildDirectory.get()}/createSrgToMcp/output.srg"

                mods {
                    "${mod_id}" {
                        source sourceSets.main
                    }
                }
            }

            client {
                property 'forge.enabledGameTestNamespaces', mod_id
            }

            server {
                property 'forge.enabledGameTestNamespaces', mod_id
                args '--nogui'
            }

            gameTestServer {
                property 'forge.enabledGameTestNamespaces', mod_id
            }

            data {
                workingDirectory project.file('run-data')
                args '--mod', mod_id,
                        '--all',
                        '--output', rootProject.file('src/generated/resources/'),
                        '--existing', rootProject.file('src/main/resources/')
            }
        }
    }

    dependencies {
        minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

        // Optional integrations: compiled against, and available in runClient/runServer,
        // but declared as optional dependencies in mods.toml.
        if (combatRollDep != null) {
            implementation fg.deobf(combatRollDep.toString())
        }
        if (betterCombatDep != null) {
            implementation fg.deobf(betterCombatDep.toString())
        }
        findProperty('deps_runtime_only')?.toString()?.split(';')?.each {
            if (!it.isBlank()) {
                runtimeOnly fg.deobf(it.trim())
            }
        }
    }

    // Reobfuscate the jar from Mojang names back to SRG for production Forge. Forge ships
    // Mojang-mapped runtime jars from Minecraft 1.20.5, so ForgeGradle no longer registers
    // this task for those targets - there is nothing left to reobfuscate to.
    if (tasks.findByName('reobfJar') != null) {
        tasks.named('jar', Jar).configure {
            finalizedBy 'reobfJar'
        }
    }
} else {
    apply plugin: 'net.neoforged.moddev'

    neoForge {
        version = neoforge_version

        if (findProperty('parchment_version') != null) {
            parchment {
                minecraftVersion = parchment_minecraft
                mappingsVersion = parchment_version
            }
        }

        runs {
            client {
                client()
                gameDirectory = project.file('run')
            }
            server {
                server()
                gameDirectory = project.file('run-server')
                programArguments.add('--nogui')
            }
        }

        mods {
            "${mod_id}" {
                sourceSet sourceSets.main
            }
        }
    }

    dependencies {
        // NeoForge ships Mojang names in production, so these jars need no remapping.
        // They are compile-only: the integrations are optional at runtime and pulling
        // their own transitive mod dependencies into the dev run is not worth it.
        if (combatRollDep != null) {
            compileOnly combatRollDep.toString()
        }
        if (betterCombatDep != null) {
            compileOnly betterCombatDep.toString()
        }
    }
}

// Resource packs declared the supported game versions as "pack_format" plus an optional
// "supported_formats" range. From format 65 Minecraft rejects that spelling and requires
// "min_format" / "max_format" instead, so the fields are built per target.
def packFormatMax = pack_format.toString().toInteger()
def packFormatMin = (findProperty('pack_format_min') ?: pack_format).toString().toInteger()
def packVersionFields
if (packFormatMax > 64) {
    packVersionFields = """"min_format": ${packFormatMin},
    "max_format": ${packFormatMax}"""
} else if (packFormatMin != packFormatMax) {
    packVersionFields = """"pack_format": ${packFormatMax},
    "supported_formats": {
      "min_inclusive": ${packFormatMin},
      "max_inclusive": ${packFormatMax}
    }"""
} else {
    packVersionFields = """"pack_format": ${packFormatMax}"""
}

// Expands ${...} placeholders in the mod metadata with this target's properties.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            pack_version_fields    : packVersionFields,
            combatroll_range       : findProperty('combatroll_range') ?: '[1.0.0,)',
            bettercombat_range     : findProperty('bettercombat_range') ?: '[1.0.0,)',
    ]

    if (isForge) {
        replaceProperties.forge_version = forge_version
        replaceProperties.forge_version_range = forge_version_range
        exclude 'META-INF/neoforge.mods.toml'
    } else {
        replaceProperties.neoforge_version = neoforge_version
        replaceProperties.neoforge_version_range = neoforge_version_range
        exclude 'META-INF/mods.toml'
    }

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Keep the per-target artifact in versions/<target>/build/libs and also publish a copy
// to the root build/libs directory after a successful single-version build.
tasks.named('build').configure {
    doLast {
        copy {
            from tasks.named('jar', Jar).flatMap { it.archiveFile }
            into rootProject.layout.buildDirectory.dir('libs')
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${rootProject.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
